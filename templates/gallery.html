{% extends 'base.html' %}{% block title %}Gallery — SCHRÖDINGER{% endblock %}{% block content %}
<section class="pagehead wrap"><p class="eyebrow">04 / VISUAL ARCHIVE</p><h1>GALLERY</h1></section><section class="gallery wrap">{% for item in gallery %}<figure><img src="{{ item.image_url }}" alt="{{ item.title }}"><figcaption>{{ item.title }}{% if item.caption %}<small>{{ item.caption }}</small>{% endif %}</figcaption></figure>{% empty %}<p>Галерея пока пуста. Добавь изображения в Django Admin.</p>{% endfor %}</section>{% endblock %}
